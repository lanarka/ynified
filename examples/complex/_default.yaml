main: !source main.yaml

my_source: !source module1.yaml

my_bson: !source-bson test.bson

gsplash/vga.png-b64: !load-base64 img/vga.png

gsplash/vga.png: !load-binary img/vga.png

hypertext: !load-text test.html

just_node:
  a: &node_a 1234
  b: "Hello"

example2: !source module2.yaml

module2: &module2 !source here/module2.yaml

#hidden
--module3: &module3 !source here/here/module3.yaml

values:
  - 1
  - yes
  - False
  - 42
  - 3.141
  - €
  - -0.0625

# eval and query
example:
    a: 10
    b: !query example.a
    c: !eval int(hello)+len(world)+Query("example.a")

foo:
    x: 10
    y: 20
    z: !query foo.x
    a: !eval (Query("foo.y")+Query("foo.x")**2)+int(hello)+Query("example.a")

# input validators
net:
  gateway_v4: !valid:ipv4 192.168.0.1
  gateway_v6: !valid:ipv6 "fe80::1"
  max_clients: !valid:int "254"
  load_factor: !valid:float "0.875"

# reads process environment variables (set `hello`/`world` before running this demo)
env:
  hello: !envvar hello
  world: !envvar world

# LIB
__now: &now !ext:timestamp "%H:%M:%S"
test-now: *now

test-yyy: !eval Info
test-zzz: !eval -1.0e14
test-aaa: -1.0e14
