#
# Hello World
# Created <timestamp>, John Doe <email@server.tld>
#
--Manifest: 1.0

META-INF:
  package:
    id: &root hello_word
    name: &package-name Hello World
    version: &package-version 1.0.0
    version-int: 1
    release: &package-release Alpha
    title: !ext:joinstr [
      *package-name,
      " ", *package-version,
      "/", *package-release
    ]
    licence: GNU/GPL
    author: John Doe <email@server.tld>
    description: >
      This is a example package.💥
  transpiler:
    uid: !ext:uuid4
    timestamp: !ext:timestamp "%Y/%m/%d %H:%M:%S"

# Multi
*root:
  cfg: !source root.yaml # config.yaml
  res: !source root.yaml # resources.yaml

validator-examples:
  port: !valid:int "8080"
  ratio: !valid:float "0.75"
  host: !valid:ipv4 "192.168.0.1"
  host6: !valid:ipv6 "::1"
